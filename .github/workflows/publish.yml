name: Release SDK packages

# Tạo release (tag vX.Y.Z trùng version của packages/*) → build admin-sdk, theme-sdk (JS + .d.ts) + CLI,
# đính kèm tarball vào release và publish lên npm: @ecomcx/nexus-admin-sdk, @ecomcx/nexus-theme-sdk, @ecomcx/create-nexus.
# npm: Trusted Publishing (OIDC, không token) — cấu hình trên npmjs.com cho từng gói: repo Ecomcx-Jsc/ecomcx-sdk, workflow publish.yml.
# Bản đầu tiên publish tay (scripts/npm-publish.mjs). Cài: npm i @ecomcx/nexus-theme-sdk
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag của release cần đính kèm tarball (vd v1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing cần npm 11.5.1+
      - run: npm install -g npm@11

      - run: npm ci --no-audit --no-fund

      - name: Tag phải trùng phiên bản của các gói
        run: test "v$(node -p "require('./packages/theme-sdk/package.json').version")" = "$TAG"

      - name: Build + kiểm tra cài thử
        run: node scripts/release.mjs --check

      - name: Đính kèm tarball vào release
        run: gh release upload "$TAG" dist-release/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish lên npm (OIDC + provenance)
        run: |
          for name in @ecomcx/nexus-admin-sdk @ecomcx/nexus-theme-sdk @ecomcx/create-nexus; do
            file=$(node -p "require('./dist-release/npm-publish.json').find(x => x.name === '$name').file")
            if npm view "$name@$(node -p "require('./packages/theme-sdk/package.json').version")" version >/dev/null 2>&1; then
              echo "$name đã có bản này trên npm — bỏ qua"; continue
            fi
            npm publish "./dist-release/$file" --access public --provenance
          done
